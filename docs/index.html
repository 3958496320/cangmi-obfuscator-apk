<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>苍米独家混淆</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: #0a0e1a;
            color: #e0e0e0;
            font-family: -apple-system, "Microsoft YaHei", sans-serif;
            font-size: 14px;
            padding: 10px;
            padding-bottom: env(safe-area-inset-bottom);
        }
        h1 {
            color: #00e5ff;
            font-size: 20px;
            text-align: center;
            margin-bottom: 2px;
        }
        .subtitle {
            color: #888;
            font-size: 12px;
            text-align: center;
            margin-bottom: 12px;
        }
        textarea {
            width: 100%;
            background: #141927;
            color: #e0e0e0;
            border: 1px solid #2a3142;
            border-radius: 8px;
            padding: 10px;
            font-family: "Courier New", monospace;
            font-size: 13px;
            resize: vertical;
            min-height: 120px;
            outline: none;
        }
        textarea:focus { border-color: #00e5ff; }
        label {
            color: #8073ff;
            font-size: 13px;
            font-weight: bold;
            display: block;
            margin: 10px 0 4px;
        }
        .btn-row {
            display: flex;
            gap: 8px;
            margin: 10px 0;
        }
        button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }
        .btn-run {
            background: #00e5ff;
            color: #000;
        }
        .btn-run:disabled {
            background: #333;
            color: #666;
            cursor: not-allowed;
        }
        .btn-clear {
            background: #2a3142;
            color: #aaa;
            flex: 0 0 80px;
        }
        .btn-copy {
            background: #4caf50;
            color: #000;
        }
        .btn-retry {
            background: #ff9800;
            color: #000;
            margin-top: 8px;
            flex: 0 0 120px;
        }
        .status {
            font-size: 12px;
            color: #888;
            text-align: center;
            margin: 8px 0;
            min-height: 16px;
            word-break: break-all;
        }
        .loading { color: #ff9800; }
        .success { color: #4caf50; }
        .error { color: #f44336; }
        #pwd-screen {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: #0a0e1a;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 999;
        }
        #pwd-screen input {
            width: 200px;
            padding: 10px;
            border: 1px solid #2a3142;
            border-radius: 8px;
            background: #141927;
            color: #e0e0e0;
            text-align: center;
            font-size: 16px;
            outline: none;
            margin-bottom: 10px;
        }
        #pwd-screen input:focus { border-color: #00e5ff; }
        #pwd-screen button {
            width: 120px;
            padding: 10px;
            background: #00e5ff;
            color: #000;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: bold;
        }
        #pwd-error {
            color: #f44336;
            font-size: 13px;
            margin-top: 8px;
            display: none;
        }
        #app { display: none; }
    </style>
</head>
<body>

<div id="pwd-screen">
    <h1>苍米独家混淆</h1>
    <p style="color:#888;font-size:12px;margin-bottom:20px;">请输入访问密码</p>
    <input type="password" id="pwd-input" placeholder="密码" autofocus>
    <button onclick="checkPwd()">进入</button>
    <div id="pwd-error">密码错误</div>
</div>

<div id="app">
    <h1>苍米独家混淆</h1>
    <div class="subtitle">12层混淆保护 · 浏览器本地运行</div>

    <label>输入 Luau 脚本</label>
    <textarea id="input-code" placeholder="在此粘贴要混淆的代码..."></textarea>

    <div class="btn-row">
        <button class="btn-clear" onclick="document.getElementById('input-code').value=''">清空</button>
        <button class="btn-run" id="btn-run" onclick="doObfuscate()" disabled>开始混淆</button>
    </div>

    <div class="status" id="status">正在加载Python环境，请稍候...</div>
    <div id="retry-area" style="display:none;text-align:center;">
        <button class="btn-retry" onclick="initPyodide()">重试加载</button>
    </div>

    <label>输出结果</label>
    <textarea id="output-code" placeholder="混淆后的代码将显示在这里..." readonly></textarea>

    <div class="btn-row">
        <button class="btn-copy" onclick="copyResult()">复制结果</button>
    </div>
</div>

<script>
// ===== 配置 =====
const ACCESS_PASSWORD = "cangmi2024";
const PYODIDE_VERSION = "0.26.2";

// 多个 CDN 源，按优先级尝试
const PYODIDE_CDNS = [
    `https://cdn.jsdelivr.net/pyodide/v${PYODIDE_VERSION}/full/`,
    `https://unpkg.com/pyodide@${PYODIDE_VERSION}/full/`,
    `https://fastly.jsdelivr.net/pyodide/v${PYODIDE_VERSION}/full/`,
];

// Python 环境
let pyodide = null;
let do_obfuscate_py = null;
let pyodideLoading = false;

function checkPwd() {
    const input = document.getElementById('pwd-input').value;
    if (input === ACCESS_PASSWORD) {
        sessionStorage.setItem('authed', '1');
        document.getElementById('pwd-screen').style.display = 'none';
        document.getElementById('app').style.display = 'block';
        if (!pyodide && !pyodideLoading) {
            initPyodide();
        }
    } else {
        document.getElementById('pwd-error').style.display = 'block';
    }
}

// 自动登录
if (sessionStorage.getItem('authed') === '1') {
    document.getElementById('pwd-screen').style.display = 'none';
    document.getElementById('app').style.display = 'block';
    if (!pyodide && !pyodideLoading) {
        initPyodide();
    }
}

// 回车提交密码
document.getElementById('pwd-input').addEventListener('keydown', function(e) {
    if (e.key === 'Enter') checkPwd();
});

// 动态加载脚本
function loadScript(url) {
    return new Promise((resolve, reject) => {
        const existing = document.querySelector(`script[src="${url}"]`);
        if (existing) {
            resolve();
            return;
        }
        const script = document.createElement('script');
        script.src = url;
        script.onload = () => resolve();
        script.onerror = () => reject(new Error('无法加载脚本: ' + url));
        document.head.appendChild(script);
    });
}

async function initPyodide() {
    if (pyodideLoading) return;
    pyodideLoading = true;

    const btn = document.getElementById('btn-run');
    const status = document.getElementById('status');
    const retryArea = document.getElementById('retry-area');

    btn.disabled = true;
    retryArea.style.display = 'none';

    // 依次尝试不同 CDN
    for (let i = 0; i < PYODIDE_CDNS.length; i++) {
        const cdn = PYODIDE_CDNS[i];
        try {
            status.textContent = `[${i+1}/${PYODIDE_CDNS.length}] 正在下载Python运行环境(约10MB)...`;
            status.className = 'status loading';

            // 加载 pyodide.js
            await loadScript(cdn + 'pyodide.js');

            status.textContent = `[${i+1}/${PYODIDE_CDNS.length}] 正在初始化Python引擎...`;

            // 初始化 Pyodide，指定 indexURL
            pyodide = await loadPyodide({ indexURL: cdn });

            status.textContent = '正在加载混淆引擎...';

            // 获取 Python 文件
            const response = await fetch('obfuscator_all.py');
            if (!response.ok) {
                throw new Error('混淆引擎文件下载失败: HTTP ' + response.status);
            }
            const pyCode = await response.text();

            // 运行 Python 代码
            pyodide.runPython(pyCode);

            // 创建代理函数
            do_obfuscate_py = pyodide.runPython(`
from pyodide.ffi import create_proxy

def _do_obfuscate(code):
    try:
        result = obfuscate_code(code)
        return result
    except Exception as e:
        import traceback
        return "ERROR: " + str(e) + "\\n" + traceback.format_exc()

create_proxy(_do_obfuscate)
`);

            // 成功
            btn.disabled = false;
            status.textContent = '引擎就绪，可以开始混淆';
            status.className = 'status success';
            setTimeout(() => {
                status.textContent = '';
                status.className = 'status';
            }, 3000);

            pyodideLoading = false;
            return;

        } catch (err) {
            console.error(`CDN ${i+1} 失败:`, err);
            status.textContent = `[${i+1}/${PYODIDE_CDNS.length}] 失败: ${err.message}`;
            status.className = 'status error';

            // 清理可能残留的 script 标签
            if (typeof loadPyodide !== 'undefined') {
                // 已经加载了 pyodide.js 但初始化失败，不需要再试其他 CDN
                if (err.message.includes('混淆引擎') || err.message.includes('初始化')) {
                    // Pyodide 加载成功但后续步骤失败，可以重试
                    break;
                }
            }
        }
    }

    // 所有 CDN 都失败
    status.textContent = '加载失败，请检查网络后点击重试。如果反复失败，请使用科学上网或换一个网络环境。';
    status.className = 'status error';
    retryArea.style.display = 'block';
    pyodideLoading = false;
}

async function doObfuscate() {
    const code = document.getElementById('input-code').value.trim();
    if (!code) {
        document.getElementById('status').textContent = '请先输入代码';
        document.getElementById('status').className = 'status error';
        return;
    }

    if (!do_obfuscate_py) {
        document.getElementById('status').textContent = '引擎还在加载中，请稍等...';
        document.getElementById('status').className = 'status loading';
        return;
    }

    const btn = document.getElementById('btn-run');
    const status = document.getElementById('status');
    btn.disabled = true;
    btn.textContent = '混淆中...';
    status.textContent = '正在处理，请稍候...';
    status.className = 'status loading';

    try {
        await new Promise(r => setTimeout(r, 50));
        const result = do_obfuscate_py(code);
        document.getElementById('output-code').value = result;

        if (result.startsWith('ERROR:')) {
            status.textContent = '混淆出错，请检查代码';
            status.className = 'status error';
        } else {
            status.textContent = '混淆完成';
            status.className = 'status success';
        }
    } catch (e) {
        status.textContent = '错误: ' + e.message;
        status.className = 'status error';
        console.error(e);
    } finally {
        btn.disabled = false;
        btn.textContent = '开始混淆';
    }
}

function copyResult() {
    const output = document.getElementById('output-code');
    output.select();
    output.setSelectionRange(0, 99999);
    document.execCommand('copy');
    const status = document.getElementById('status');
    status.textContent = '已复制到剪贴板';
    status.className = 'status success';
    setTimeout(() => {
        status.textContent = '';
        status.className = 'status';
    }, 2000);
}
</script>

</body>
</html>
